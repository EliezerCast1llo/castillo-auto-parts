name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/castillo_auto_parts
  DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/castillo_auto_parts
  NEXT_PUBLIC_APP_NAME: Castillo Auto Parts
  NEXT_PUBLIC_DEFAULT_LOCALE: es
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  PAYMENT_PROVIDER: mock
  EMAIL_PROVIDER: console
  EMAIL_FROM: Castillo Auto Parts <no-reply@castilloautoparts.local>
  ADMIN_ACCESS_SECRET: ci-admin-secret-at-least-32-characters-long
  ADMIN_SEED_EMAIL: admin@ci.castilloautoparts.com
  ADMIN_SEED_PASSWORD: ci-admin-password-for-github-actions
  GUEST_CART_SECRET: ci-guest-cart-secret-at-least-32-characters-long
  NEXTAUTH_SECRET: ci-nextauth-secret-at-least-32-characters-long
  # El E2E corre en :3100 (scripts/run-e2e.ts). AUTH_TRUST_HOST permite que
  # Auth.js v5 acepte la sesión independientemente del host/puerto en CI.
  NEXTAUTH_URL: http://localhost:3100
  AUTH_TRUST_HOST: "1"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: castillo_auto_parts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d castillo_auto_parts"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Prepare database
        run: |
          npm run db:migrate:deploy
          npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    env:
      E2E_DATABASE_SCHEMA: e2e_${{ github.run_id }}_${{ github.run_attempt }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: castillo_auto_parts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d castillo_auto_parts"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
