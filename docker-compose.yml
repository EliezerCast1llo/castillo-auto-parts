services:
  postgres:
    image: postgres:16-alpine
    container_name: castillo-auto-parts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: castillo_auto_parts
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d castillo_auto_parts"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
