services:
  postgres:
    image: postgres:16-alpine
    container_name: castillo-auto-parts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: castillo_auto_parts
    ports:
      # Puerto host configurable; default 5433 para coincidir con .env y evitar
      # choque con otras instancias de Postgres en el 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d castillo_auto_parts"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
