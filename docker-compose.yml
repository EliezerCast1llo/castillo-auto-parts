services:
  postgres:
    image: postgres:16-alpine
    container_name: castillo-auto-parts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: castillo_auto_parts
    ports:
      # Puerto host configurable. Default 5432 (coincide con .env.example y README);
      # ante choque con otra instancia local, exportar POSTGRES_HOST_PORT (p.ej. 5433)
      # y ajustar DATABASE_URL a ese puerto.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d castillo_auto_parts"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
